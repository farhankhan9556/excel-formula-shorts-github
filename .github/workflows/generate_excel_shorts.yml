name: Daily Excel Formula Shorts

on:
  schedule:
    # 04:00 UTC = 08:00 UAE time
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      run_date:
        description: "Optional date YYYY-MM-DD. Leave blank for today."
        required: false
        type: string

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate 3 Excel Shorts
        env:
          RUN_DATE: ${{ inputs.run_date }}
        run: |
          if [ -n "$RUN_DATE" ]; then
            python excel_formula_generator.py --date "$RUN_DATE" --count 3
          else
            python excel_formula_generator.py --count 3
          fi

      - name: Check generated files
        run: |
          ls -lh output/
          test "$(find output -maxdepth 1 -name '*.mp4' | wc -l)" -eq 3

      - name: Upload videos as artifact
        uses: actions/upload-artifact@v4
        with:
          name: excel-formula-shorts
          path: output/
          if-no-files-found: error
          retention-days: 3
