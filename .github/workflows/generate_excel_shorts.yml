name: Daily Learn Verse Excel Shorts
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      run_date:
        description: "Optional date for testing (YYYY-MM-DD)"
        required: false
        type: string
      count:
        description: "Number of Shorts to generate"
        required: false
        default: "3"
        type: string
permissions:
  contents: read
jobs:
  generate:
    name: Generate 3 Excel Shorts
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Linux tools
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y ffmpeg libreoffice xvfb xdotool fonts-dejavu fonts-liberation
      - name: Verify tools
        run: |
          set -e
          ffmpeg -version | head -n 1
          libreoffice --version
          fc-match "DejaVu Sans"
      - name: Check repository files
        run: |
          set -e
          test -f formula_library.py
          test -f make_workbook.py
          test -f record_calc.py
          test -f make_voice.py
          test -f render_video.py
          test -f generate_daily.py
          test -f requirements.txt
          test -f assets/learnverse_logo.png
      - name: Install Python packages
        run: |
          set -e
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Test Python modules
        run: |
          python -c "import openpyxl, PIL, edge_tts; print('Python modules OK')"
      - name: Test Edge TTS
        run: |
          set -e
          rm -f /tmp/learnverse_tts_test.mp3
          python make_voice.py "Welcome to Learn Verse. Here is a quick Excel tip." /tmp/learnverse_tts_test.mp3
          test -s /tmp/learnverse_tts_test.mp3
          ffprobe -v error -show_entries format=duration -show_entries stream=codec_name -of default=noprint_wrappers=1 /tmp/learnverse_tts_test.mp3
      - name: Prepare output
        run: |
          rm -rf output
          mkdir -p output
      - name: Generate 3 Excel Shorts
        env:
          RUN_DATE: ${{ inputs.run_date }}
          VIDEO_COUNT: ${{ inputs.count }}
        run: |
          set -e
          COUNT="${VIDEO_COUNT:-3}"
          if [ -n "$RUN_DATE" ]; then
            python generate_daily.py --date "$RUN_DATE" --count "$COUNT"
          else
            python generate_daily.py --count "$COUNT"
          fi
      - name: Show generated files
        if: always()
        run: |
          find output -maxdepth 1 -type f -printf '%f\t%k KB\n' | sort || true
      - name: Validate generated files
        run: |
          set -e
          test "$(find output -maxdepth 1 -name '*.mp4' | wc -l)" -eq 3
          test "$(find output -maxdepth 1 -name '*.xlsx' | wc -l)" -eq 3
          test -s output/manifest.json
          for file in output/*.mp4; do
            test -s "$file"
            ffprobe -v error -show_entries stream=codec_name,width,height -show_entries format=duration,size -of default=noprint_wrappers=1 "$file"
          done
          for file in output/*.xlsx; do
            test -s "$file"
            python - "$file" <<'PY'
          import sys
          from openpyxl import load_workbook
          wb=load_workbook(sys.argv[1],read_only=True,data_only=False)
          assert wb.sheetnames
          print(sys.argv[1], wb.sheetnames)
          wb.close()
          PY
          done
      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: learnverse-excel-shorts-${{ github.run_number }}
          path: |
            output/*.mp4
            output/*.xlsx
            output/manifest.json
          if-no-files-found: warn
          retention-days: 3
