name: Daily Learn Verse Excel Shorts

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      run_date:
        description: "Optional test date (YYYY-MM-DD)"
        required: false
        type: string
      count:
        description: "Number of Shorts to generate"
        required: false
        default: "3"
        type: string

permissions:
  contents: read

jobs:
  generate:
    name: Generate Learn Verse Excel Shorts
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Linux tools
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            libreoffice \
            xvfb \
            xdotool \
            x11-utils \
            fonts-dejavu \
            fonts-liberation

      - name: Verify tools
        run: |
          set -eux
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
          libreoffice --version
          xdotool -v
          xdpyinfo -version || true
          fc-match "DejaVu Sans"

      - name: Check required files
        run: |
          set -eux
          test -f formula_library.py
          test -f make_workbook.py
          test -f record_calc.py
          test -f make_voice.py
          test -f render_video.py
          test -f generate_daily.py
          test -f requirements.txt
          test -f assets/learnverse_logo.png

      - name: Install Python packages
        run: |
          set -eux
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Python syntax check
        run: |
          set -eux
          python -m py_compile \
            formula_library.py \
            make_workbook.py \
            record_calc.py \
            make_voice.py \
            render_video.py \
            generate_daily.py

      - name: Test workbook generation
        run: |
          set -eux
          rm -rf /tmp/lv-smoke
          mkdir -p /tmp/lv-smoke
          python make_workbook.py 1 /tmp/lv-smoke/test.xlsx
          test -s /tmp/lv-smoke/test.xlsx
          python - <<'PY'
          from openpyxl import load_workbook
          wb = load_workbook("/tmp/lv-smoke/test.xlsx", read_only=True, data_only=False)
          ws = wb["Excel Tip"]
          print("Sheets:", wb.sheetnames)
          print("Formula cells:", [ws.cell(5, c).value for c in range(1, ws.max_column + 1) if isinstance(ws.cell(5, c).value, str) and ws.cell(5, c).value.startswith("=")])
          wb.close()
          PY

      - name: Test Edge TTS
        run: |
          set -eux
          rm -f /tmp/lv-tts.mp3
          python make_voice.py \
            "Welcome to Learn Verse. Here is a quick Excel tip." \
            /tmp/lv-tts.mp3
          test -s /tmp/lv-tts.mp3
          ffprobe -v error \
            -show_entries format=duration \
            -show_entries stream=codec_name \
            -of default=noprint_wrappers=1 \
            /tmp/lv-tts.mp3

      - name: Test Xvfb and FFmpeg screen capture
        run: |
          set -eux
          rm -f /tmp/lv-display-test.mp4
          xvfb-run -a \
            --server-args="-screen 0 1365x900x24 -ac" \
            bash -lc '
              set -eux
              echo "DISPLAY=$DISPLAY"
              xdpyinfo >/dev/null
              ffmpeg -hide_banner -loglevel error -y \
                -f x11grab \
                -video_size 1365x900 \
                -framerate 10 \
                -i "$DISPLAY.0" \
                -t 2 \
                -c:v libx264 \
                -pix_fmt yuv420p \
                /tmp/lv-display-test.mp4
            '
          test -s /tmp/lv-display-test.mp4
          ffprobe -v error /tmp/lv-display-test.mp4

      - name: Prepare output
        run: |
          set -eux
          rm -rf output
          mkdir -p output

      - name: Generate 3 Excel Shorts
        env:
          RUN_DATE: ${{ inputs.run_date }}
          VIDEO_COUNT: ${{ inputs.count }}
        run: |
          set -eux
          COUNT="${VIDEO_COUNT:-3}"
          if [ -n "${RUN_DATE:-}" ]; then
            xvfb-run -a \
              --server-args="-screen 0 1365x900x24 -ac" \
              python generate_daily.py --date "$RUN_DATE" --count "$COUNT"
          else
            xvfb-run -a \
              --server-args="-screen 0 1365x900x24 -ac" \
              python generate_daily.py --count "$COUNT"
          fi

      - name: Show generated files
        if: always()
        run: |
          find output -maxdepth 1 -type f -printf '%f\t%k KB\n' | sort || true

      - name: Validate generated files
        run: |
          set -eux
          test "$(find output -maxdepth 1 -name '*.mp4' | wc -l)" -eq 3
          test "$(find output -maxdepth 1 -name '*.xlsx' | wc -l)" -eq 3
          test -s output/manifest.json

          for f in output/*.mp4; do
            test -s "$f"
            ffprobe -v error \
              -show_entries stream=codec_name,width,height,r_frame_rate \
              -show_entries format=duration,size \
              -of default=noprint_wrappers=1 "$f"
          done

          for f in output/*.xlsx; do
            test -s "$f"
            python - "$f" <<'PY'
          import sys
          from openpyxl import load_workbook
          wb = load_workbook(sys.argv[1], read_only=True, data_only=False)
          assert wb.sheetnames
          print(sys.argv[1], wb.sheetnames)
          wb.close()
          PY
          done

      - name: Upload generated outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: learnverse-excel-shorts-${{ github.run_number }}
          path: |
            output/*.mp4
            output/*.xlsx
            output/manifest.json
          if-no-files-found: warn
          retention-days: 3

      - name: Success
        if: success()
        run: |
          echo "SUCCESS: Learn Verse generated and validated 3 Excel Shorts."
