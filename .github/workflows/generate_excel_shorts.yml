name: Daily Learn Verse Excel Shorts

on:
  schedule:
    # 04:00 UTC = 08:00 UAE
    - cron: "0 4 * * *"

  workflow_dispatch:
    inputs:
      run_date:
        description: "Optional YYYY-MM-DD for testing"
        required: false
        type: string

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Linux tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            libreoffice \
            xvfb \
            xdotool \
            fonts-dejavu

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Test Edge TTS before generating videos
        run: |
          python make_voice.py \
            "This is a Learn Verse Excel tip." \
            /tmp/tts_test.mp3
          test -s /tmp/tts_test.mp3
          ffprobe -v error /tmp/tts_test.mp3
          echo "TTS test passed."

      - name: Generate 3 Excel Shorts
        env:
          RUN_DATE: ${{ inputs.run_date }}
        run: |
          if [ -n "$RUN_DATE" ]; then
            python generate_daily.py --date "$RUN_DATE" --count 3
          else
            python generate_daily.py --count 3
          fi

      - name: Validate generated files
        run: |
          echo "Generated files:"
          ls -lh output/

          test "$(find output -maxdepth 1 -name '*.mp4' | wc -l)" -eq 3
          test "$(find output -maxdepth 1 -name '*.xlsx' | wc -l)" -eq 3
          test -s output/manifest.json

          for f in output/*.mp4; do
            echo "Checking $f"
            ffprobe -v error "$f"
          done

      - name: Upload videos and Excel workbooks
        uses: actions/upload-artifact@v4
        with:
          name: learnverse-excel-shorts
          path: output/
          if-no-files-found: error
          retention-days: 3
