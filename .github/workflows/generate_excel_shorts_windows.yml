name: Learn Verse Excel Reference Style

on:
  workflow_dispatch:
    inputs:
      run_date:
        description: "YYYY-MM-DD (optional)"
        required: false
        type: string
      count:
        description: "1-3"
        required: false
        default: "3"
        type: string
  schedule:
    - cron: "0 4 * * *"

jobs:
  generate:
    # IMPORTANT: this must be your Windows self-hosted PC/VM with Microsoft Excel installed.
    runs-on: [self-hosted, windows, excel]
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Install Python packages
        shell: powershell
        run: |
          py -3 -m pip install --upgrade pip
          py -3 -m pip install -r requirements.txt

      - name: Check Excel and FFmpeg
        shell: powershell
        run: |
          $excel = Get-Process EXCEL -ErrorAction SilentlyContinue
          Write-Host "Excel process before job: $($excel.Count)"
          ffmpeg -version | Select-Object -First 1
          py -3 --version
          if (!(Test-Path "assets/learnverse_logo.png")) {
            Write-Error "assets/learnverse_logo.png is missing"
          }

      - name: Generate videos
        shell: powershell
        env:
          RUN_DATE: ${{ inputs.run_date }}
          VIDEO_COUNT: ${{ inputs.count }}
        run: |
          $count = if ($env:VIDEO_COUNT) { $env:VIDEO_COUNT } else { "3" }
          if ($env:RUN_DATE) {
            py -3 generate_windows.py --date $env:RUN_DATE --count $count
          } else {
            py -3 generate_windows.py --count $count
          }

      - name: Validate
        shell: powershell
        run: |
          $mp4 = @(Get-ChildItem output -Filter *.mp4)
          $xlsx = @(Get-ChildItem output -Filter *.xlsx)
          if ($mp4.Count -ne 3) { throw "Expected 3 MP4 files, found $($mp4.Count)" }
          if ($xlsx.Count -ne 3) { throw "Expected 3 XLSX files, found $($xlsx.Count)" }
          foreach ($f in $mp4) {
            if ($f.Length -lt 50000) { throw "Invalid MP4: $($f.Name)" }
            ffprobe -v error $f.FullName
          }

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: learnverse-excel-reference-${{ github.run_number }}
          path: |
            output/*.mp4
            output/*.xlsx
            output/manifest.json
          retention-days: 3
