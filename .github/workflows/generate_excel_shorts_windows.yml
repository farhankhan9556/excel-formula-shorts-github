name: Learn Verse Excel Shorts

on:
  workflow_dispatch:
    inputs:
      run_date:
        description: "Date YYYY-MM-DD (leave blank for today)"
        required: false
        default: ""
      count:
        description: "Number of Shorts"
        required: true
        default: "3"
        type: choice
        options:
          - "1"
          - "2"
          - "3"

  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: read

jobs:
  generate:
    name: Generate Excel Shorts
    runs-on: [self-hosted, windows, excel]
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: System check
        shell: cmd
        run: |
          echo ==========================================
          echo LEARN VERSE EXCEL SHORTS V5
          echo ==========================================
          python --version
          ffmpeg -version
          python -c "import win32com.client as w; e=w.DispatchEx('Excel.Application'); print('Excel version:', e.Version); e.Quit()"
          echo Permanent output:
          echo C:\excel-formula-shorts-github\output
          echo ==========================================

      - name: Install Python requirements
        shell: cmd
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Generate Shorts
        shell: cmd
        env:
          RUN_DATE: ${{ inputs.run_date }}
          VIDEO_COUNT: ${{ inputs.count }}
        run: |
          if "%VIDEO_COUNT%"=="" set VIDEO_COUNT=3

          if "%RUN_DATE%"=="" (
            python excel_runner.py --count %VIDEO_COUNT%
          ) else (
            python excel_runner.py --date "%RUN_DATE%" --count %VIDEO_COUNT%
          )

          if errorlevel 1 exit /b 1

      - name: Validate permanent PC output
        shell: powershell
        env:
          VIDEO_COUNT: ${{ inputs.count }}
        run: |
          $count = $env:VIDEO_COUNT
          if ([string]::IsNullOrWhiteSpace($count)) { $count = "3" }

          $out = "C:\excel-formula-shorts-github\output"
          $manifest = Join-Path $out "learnverse_current_run_manifest.json"

          Write-Host "Permanent output: $out"
          Write-Host "Expected videos from THIS run: $count"
          Write-Host "Manifest: $manifest"

          if (-not (Test-Path -LiteralPath $manifest -PathType Leaf)) {
            throw "Current-run manifest not found: $manifest"
          }

          $data = Get-Content -LiteralPath $manifest -Raw | ConvertFrom-Json
          Write-Host "Manifest expected count: $($data.expected_count)"
          Write-Host "Manifest generated count: $($data.generated_count)"

          if ([int]$data.expected_count -ne [int]$count) {
            throw "Manifest count mismatch: expected $count."
          }

          $items = @($data.files)
          if ($items.Count -ne [int]$count) {
            throw "Current run generated $($items.Count) file sets; expected $count."
          }

          foreach ($item in $items) {
            foreach ($key in @("video","workbook","metadata")) {
              $name = [string]$item.$key
              if ([string]::IsNullOrWhiteSpace($name)) {
                throw "Manifest missing $key."
              }
              $full = Join-Path $out $name
              if (-not (Test-Path -LiteralPath $full -PathType Leaf)) {
                throw "Missing permanent output file: $full"
              }
              $length = (Get-Item -LiteralPath $full).Length
              if ($length -le 0) {
                throw "Empty permanent output file: $full"
              }
              Write-Host "$key : $name ($length bytes)"
            }
          }

          Write-Host "PERMANENT OUTPUT VALIDATION SUCCESSFUL"

      - name: Upload generated files as artifact
        uses: actions/upload-artifact@v4
        with:
          name: learnverse-excel-shorts-${{ github.run_number }}
          path: |
            output/*.mp4
            output/*.xlsx
            output/*.json
          retention-days: 3
          if-no-files-found: error

      - name: Cleanup Python cache
        if: always()
        shell: cmd
        run: |
          for /d /r . %%d in (__pycache__) do @if exist "%%d" rd /s /q "%%d"
          if exist .pytest_cache rd /s /q .pytest_cache
