name: Learn Verse Excel Shorts
on:
  workflow_dispatch:
    inputs:
      run_date:
        description: "Date YYYY-MM-DD"
        required: false
        default: ""
      count:
        description: "Number of Shorts"
        required: true
        default: "1"
        type: choice
        options: ["1","2","3"]
  schedule:
    - cron: "0 4 * * *"
permissions:
  contents: read
jobs:
  generate:
    runs-on: [self-hosted, windows, excel]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: System check
        shell: powershell
        run: |
          python --version
          ffmpeg -version | Select-Object -First 1
          $e=New-Object -ComObject Excel.Application
          Write-Host "Excel $($e.Version) detected"
          $e.Quit()
      - name: Install dependencies
        shell: powershell
        run: python -m pip install -r requirements.txt
      - name: Generate
        shell: powershell
        env:
          RUN_DATE: ${{ inputs.run_date }}
          VIDEO_COUNT: ${{ inputs.count }}
        run: |
          if (-not $env:VIDEO_COUNT) { $env:VIDEO_COUNT="3" }
          $args=@("--count",$env:VIDEO_COUNT)
          if ($env:RUN_DATE) { $args += @("--date",$env:RUN_DATE) }
          python excel_runner.py @args
      - name: Validate
        shell: powershell
        run: |
          $v=@(Get-ChildItem output\*.mp4)
          $x=@(Get-ChildItem output\*.xlsx)
          if ($v.Count -lt 1) { throw "No MP4 generated" }
          if ($x.Count -lt 1) { throw "No XLSX generated" }
          $v | Select Name,Length | Format-Table -AutoSize
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: learnverse-excel-shorts-${{ github.run_number }}
          path: output/*
          retention-days: 3
          if-no-files-found: error
      - name: Cleanup
        if: always()
        shell: powershell
        run: |
          Remove-Item work -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item __pycache__ -Recurse -Force -ErrorAction SilentlyContinue
