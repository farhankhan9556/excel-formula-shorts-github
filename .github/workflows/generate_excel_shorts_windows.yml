name: Learn Verse Excel Shorts

on:
  workflow_dispatch:
    inputs:
      run_date:
        description: "Date YYYY-MM-DD (leave blank for today)"
        required: false
        default: ""
      count:
        description: "Number of Shorts"
        required: true
        default: "3"
        type: choice
        options:
          - "1"
          - "2"
          - "3"

  schedule:
    # 02:00 UTC = 06:00 UAE
    # Gives the system several hours before the 09:00 UAE upload window.
    - cron: "0 2 * * *"

permissions:
  contents: read

jobs:
  generate:
    name: Generate Excel Shorts
    runs-on: [self-hosted, windows, excel]
    timeout-minutes: 120

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: System check
        shell: cmd
        run: |
          echo ==========================================
          echo LEARN VERSE EXCEL SHORTS
          echo ==========================================
          echo.
          echo Python:
          python --version
          echo.
          echo FFmpeg:
          ffmpeg -version
          echo.
          echo Excel:
          python -c "import win32com.client as w; e=w.DispatchEx('Excel.Application'); print('Excel version:', e.Version); e.Quit()"
          echo.
          echo ==========================================

      - name: Install Python requirements
        shell: cmd
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Generate Shorts
        shell: cmd
        env:
          RUN_DATE: ${{ inputs.run_date }}
          VIDEO_COUNT: ${{ inputs.count }}
        run: |
          if "%VIDEO_COUNT%"=="" set VIDEO_COUNT=3

          if "%RUN_DATE%"=="" (
            echo Generating %VIDEO_COUNT% Shorts for today...
            python excel_runner.py --count %VIDEO_COUNT%
          ) else (
            echo Generating %VIDEO_COUNT% Shorts for %RUN_DATE%...
            python excel_runner.py --date "%RUN_DATE%" --count %VIDEO_COUNT%
          )

          if errorlevel 1 (
            echo.
            echo ==========================================
            echo GENERATOR FAILED
            echo ==========================================
            exit /b 1
          )

      - name: Validate generated files
        shell: cmd
        env:
          RUN_DATE: ${{ inputs.run_date }}
          VIDEO_COUNT: ${{ inputs.count }}
        run: |
          if "%VIDEO_COUNT%"=="" set VIDEO_COUNT=3

          echo ==========================================
          echo VALIDATING GENERATED SHORTS
          echo ==========================================

          if "%RUN_DATE%"=="" (
            for /f %%D in ('powershell -NoProfile -Command "(Get-Date).ToString('yyyy-MM-dd')"') do set CHECK_DATE=%%D
          ) else (
            set CHECK_DATE=%RUN_DATE%
          )

          echo Check date: %CHECK_DATE%
          echo Expected videos: %VIDEO_COUNT%
          echo.

          python -c "import os, pathlib, sys; d=os.environ['CHECK_DATE']; expected=int(os.environ['VIDEO_COUNT']); p=pathlib.Path('output'); videos=sorted(p.glob(f'learnverse_{d}_*.mp4')); workbooks=sorted(p.glob(f'learnverse_{d}_*.xlsx')); metadata=sorted(p.glob(f'learnverse_{d}_*.json')); print('MP4 videos:',len(videos)); print('Excel workbooks:',len(workbooks)); print('Metadata files:',len(metadata)); print(); [print('VIDEO:',x.name) for x in videos]; print(); sys.exit(0 if len(videos)==expected else 1)"

          if errorlevel 1 (
            echo.
            echo ==========================================
            echo VALIDATION FAILED
            echo ==========================================
            exit /b 1
          )

          echo.
          echo ==========================================
          echo VALIDATION SUCCESSFUL
          echo ==========================================

      - name: Upload generated files as artifact
        uses: actions/upload-artifact@v4
        with:
          name: learnverse-excel-shorts-${{ github.run_number }}
          path: |
            output/*.mp4
            output/*.xlsx
            output/*.json
          retention-days: 3
          if-no-files-found: error

      - name: Cleanup temporary Python cache
        if: always()
        shell: cmd
        run: |
          for /d /r . %%d in (__pycache__) do @if exist "%%d" rd /s /q "%%d"
          if exist .pytest_cache rd /s /q .pytest_cache