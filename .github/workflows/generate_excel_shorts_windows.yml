name: Learn Verse Excel Shorts

on:
  workflow_dispatch:
    inputs:
      run_date:
        description: "Date YYYY-MM-DD (leave blank for today)"
        required: false
        default: ""
      count:
        description: "Number of Shorts"
        required: true
        default: "3"
        type: choice
        options:
          - "1"
          - "2"
          - "3"

  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: read

jobs:
  generate:
    name: Generate Excel Shorts
    runs-on: [self-hosted, windows, excel]
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: System check
        shell: cmd
        run: |
          echo ==========================================
          echo LEARN VERSE EXCEL SHORTS V5
          echo ==========================================
          python --version
          ffmpeg -version
          python -c "import win32com.client as w; e=w.DispatchEx('Excel.Application'); print('Excel version:', e.Version); e.Quit()"
          echo Permanent output:
          echo C:\excel-formula-shorts-github\output
          echo ==========================================

      - name: Install Python requirements
        shell: cmd
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Generate Shorts
        shell: cmd
        env:
          RUN_DATE: ${{ inputs.run_date }}
          VIDEO_COUNT: ${{ inputs.count }}
        run: |
          if "%VIDEO_COUNT%"=="" set VIDEO_COUNT=3

          if "%RUN_DATE%"=="" (
            python excel_runner.py --count %VIDEO_COUNT%
          ) else (
            python excel_runner.py --date "%RUN_DATE%" --count %VIDEO_COUNT%
          )

          if errorlevel 1 exit /b 1

      - name: Validate permanent PC output
        shell: powershell
        env:
          RUN_DATE: ${{ inputs.run_date }}
          VIDEO_COUNT: ${{ inputs.count }}
        run: |
          $count = $env:VIDEO_COUNT
          if ([string]::IsNullOrWhiteSpace($count)) { $count = "3" }

          $date = $env:RUN_DATE
          if ([string]::IsNullOrWhiteSpace($date)) {
            $date = (Get-Date).ToString("yyyy-MM-dd")
          }

          $out = "C:\excel-formula-shorts-github\output"
          Write-Host "Permanent output: $out"
          Write-Host "Date: $date"
          Write-Host "Expected videos: $count"

          $videos = @(Get-ChildItem $out -File -Filter "learnverse_${date}_*.mp4")
          $xlsx   = @(Get-ChildItem $out -File -Filter "learnverse_${date}_*.xlsx")
          $json   = @(Get-ChildItem $out -File -Filter "learnverse_${date}_*.json")

          Write-Host "MP4: $($videos.Count)"
          Write-Host "XLSX: $($xlsx.Count)"
          Write-Host "JSON: $($json.Count)"

          $videos | Format-Table Name,Length,LastWriteTime -AutoSize

          if ($videos.Count -ne [int]$count -or
              $xlsx.Count -ne [int]$count -or
              $json.Count -ne [int]$count) {
            throw "Permanent output validation failed."
          }

      - name: Upload generated files as artifact
        uses: actions/upload-artifact@v4
        with:
          name: learnverse-excel-shorts-${{ github.run_number }}
          path: |
            output/*.mp4
            output/*.xlsx
            output/*.json
          retention-days: 3
          if-no-files-found: error

      - name: Cleanup Python cache
        if: always()
        shell: cmd
        run: |
          for /d /r . %%d in (__pycache__) do @if exist "%%d" rd /s /q "%%d"
          if exist .pytest_cache rd /s /q .pytest_cache
